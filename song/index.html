  <style>
    /* ── 노래책 전용 ── */
    .sb-bar{display:flex;flex-wrap:wrap;align-items:center;gap:14px;margin:0 0 16px}
    .sb-search{flex:1;min-width:230px;display:flex;align-items:center;gap:10px;padding:0 16px;border:1px solid var(--line);background:var(--glass)}
    .sb-search i{font-style:normal;color:var(--tx-dim);font-size:12px}
    .sb-search input{flex:1;padding:13px 0;border:0;background:none;color:var(--tx);font-family:var(--font-body);font-size:13.5px}
    .sb-search input::placeholder{color:var(--tx-dim)}
    .sb-search input:focus{outline:none}
    .sb-count{color:var(--tx-dim);font-family:var(--font-body);font-weight:700;font-size:11px;letter-spacing:.08em;white-space:nowrap}

    .sb-cats{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 20px}
    .sb-cat{
      padding:9px 16px;border:1px solid var(--line);background:rgba(255,255,255,.04);
      color:var(--tx);cursor:pointer;font-family:var(--font-body);font-size:12px;font-weight:750;letter-spacing:.04em;
      transition:background 140ms ease;
    }
    body.day .sb-cat{background:rgba(255,255,255,.5)}
    .sb-cat:hover{background:rgba(255,177,177,.12)}
    .sb-cat.on{background:var(--point);color:#fff;border-color:var(--point)}
    body.day .sb-cat.on{background:#9c1f31;border-color:#9c1f31;color:#fff}

    .sb-wrap{border:1px solid var(--line);background:var(--glass);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);overflow-x:auto}
    table.sb{width:100%;border-collapse:collapse;min-width:760px}
    table.sb th{
      padding:13px 12px;border-bottom:1px solid var(--line);white-space:nowrap;
      color:var(--tx-dim);font-family:var(--font-body);font-weight:800;font-size:11.5px;letter-spacing:.06em;text-align:left;
    }
    table.sb td{padding:13px 12px;border-bottom:1px solid var(--line-soft);font-size:13.5px;vertical-align:middle}
    table.sb tr:last-child td{border-bottom:0}
    table.sb tbody tr:hover{background:rgba(255,177,177,.07)}
    .sb-no{width:52px;color:var(--tx-dim);font-family:var(--font-body);font-size:12px}
    .sb-artist{color:var(--tx-soft);white-space:nowrap}
    .sb-title{font-weight:750}
    .sb-tag{
      display:inline-block;padding:3px 9px;border:1px solid var(--line-soft);
      font-size:11px;font-weight:650;white-space:nowrap;
    }
    .sb-price{color:var(--accent-txt);font-family:var(--font-body);font-weight:700;font-size:13px;white-space:nowrap}
    body.day .sb-price{color:var(--accent-txt)}
    .sb-note{color:var(--tx-soft);font-size:12.5px;line-height:1.6;min-width:120px}
    .sb-hit{background:rgba(255,177,177,.14)}

    @media (max-width:620px){
      table.sb{min-width:620px}
      table.sb th,table.sb td{padding:10px 8px;font-size:12.5px}
    }
  </style>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
  <script src="../supabase.js?v=20260731b"></script>
  <script src="../js/cinema.js?v=20260731b"></script>
  <script>
  (function(){
    var esc=CN.esc, txt=CN.txt;
    var songs=[], curCat='전체', q='';
    var catOrder=[];            /* admin에서 등록한 카테고리 순서 */

    function cats(){
      var used=[];
      songs.forEach(function(s){
        var c=txt(s.category).trim();
        if(c && c!=='전체' && used.indexOf(c)===-1) used.push(c);
      });
      /* admin에 등록한 분류는 곡이 없어도 그대로 노출하고, 목록에만 있는 분류는 뒤에 붙인다 */
      var out=catOrder.slice();
      used.forEach(function(c){ if(out.indexOf(c)===-1) out.push(c); });
      return ['전체'].concat(out);
    }
    function renderCats(){
      var el=document.getElementById('sb-cats'), list=cats();
      if(list.length<=1){ el.innerHTML=''; return; }
      el.innerHTML=list.map(function(c){
        return '<button class="sb-cat'+(c===curCat?' on':'')+'" type="button" data-c="'+esc(c)+'">'+esc(c)+'</button>';
      }).join('');
      el.querySelectorAll('.sb-cat').forEach(function(b){
        b.addEventListener('click',function(){ curCat=b.dataset.c; renderCats(); render(); });
      });
    }
    function hi(s){
      s=esc(s);
      if(!q) return s;
      try{
        var re=new RegExp('('+q.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')+')','gi');
        return s.replace(re,'<span class="sb-hit">$1</span>');
      }catch(e){ return s; }
    }
    function priceCell(v){
      var n=parseInt(v,10)||0;
      if(n<=0) return '<span style="color:var(--tx-dim)">—</span>';
      return '<span class="sb-price">'+n+'개</span>';
    }
    function render(){
      var list=songs.filter(function(s){
        if(curCat!=='전체' && txt(s.category).trim()!==curCat) return false;
        if(q){
          var hay=(txt(s.title)+' '+txt(s.artist)+' '+txt(s.genre)).toLowerCase();
          if(hay.indexOf(q.toLowerCase())===-1) return false;
        }
        return true;
      }).sort(function(a,b){
        var sa=+a.sort_order||0, sb=+b.sort_order||0;
        if(sa!==sb) return sa-sb;
        var aa=txt(a.artist), ab=txt(b.artist);
        if(aa!==ab) return aa.localeCompare(ab,'ko');
        return txt(a.title).localeCompare(txt(b.title),'ko');
      });
      document.getElementById('sb-count').textContent=list.length+' SONGS';
      var tb=document.getElementById('sb-list');
      if(!list.length){
        var msg = q ? '찾는 노래가 없어요'
                : (curCat!=='전체' ? esc(curCat)+' 분류에 등록된 노래가 아직 없어요' : '아직 등록된 노래가 없어요');
        tb.innerHTML='<tr><td colspan="8"><div class="cn-empty">'+msg+'</div></td></tr>';
        return;
      }
      tb.innerHTML=list.map(function(s,i){
        return '<tr>'+
          '<td class="sb-no">'+(i+1)+'</td>'+
          '<td class="sb-artist">'+hi(txt(s.artist))+'</td>'+
          '<td class="sb-title">'+hi(txt(s.title))+'</td>'+
          '<td>'+(txt(s.genre).trim()?'<span class="sb-tag">'+esc(s.genre)+'</span>':'<span style="color:var(--tx-dim)">—</span>')+'</td>'+
          '<td>'+(txt(s.level).trim()?esc(s.level):'<span style="color:var(--tx-dim)">—</span>')+'</td>'+
          '<td>'+(txt(s.mastery).trim()?esc(s.mastery):'<span style="color:var(--tx-dim)">—</span>')+'</td>'+
          '<td>'+priceCell(s.price)+'</td>'+
          '<td class="sb-note">'+(txt(s.note).trim()?CN.linkify(s.note):'')+'</td>'+
          '</tr>';
      }).join('');
    }
    document.getElementById('sb-q').addEventListener('input',function(e){ q=(e.target.value||'').trim(); render(); });

    async function load(){
      try{
        var rp=await db.from('profile').select('data').eq('id',1);
        var pd=rp&&rp.data&&rp.data[0]&&rp.data[0].data;
        if(pd && txt(pd['song-desc']).trim())
          document.getElementById('pg-desc').innerHTML=CN.linkify(pd['song-desc']);
        if(pd && Array.isArray(pd['song-cats'])) catOrder=pd['song-cats'].map(txt).filter(Boolean);
        var r=await db.from('songs').select('*');
        if(r&&Array.isArray(r.data)) songs=r.data;
      }catch(e){}
      finally{ renderCats(); render(); CN.dataReady(); CN.reveal(); }
    }
    renderCats(); render();
    load();
  })();
  </script>
